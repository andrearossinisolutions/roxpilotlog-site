name: Deploy roxpilotlog-site

on:
  push:
    branches:
      - main

concurrency:
  group: roxpilotlog-site-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show runtime versions
        run: |
          which node
          node -v
          npm -v

      - name: Deploy locally on server
        run: |
          set -euo pipefail

          APP_ROOT="/var/www/roxpilotlog-site"
          LIVE_DIR="$APP_ROOT/current"
          SERVICE="roxpilotlog-site"

          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Live dir:  $LIVE_DIR"

          # Forza anche le devDependencies (servono per la build), anche se NODE_ENV=production
          npm ci --include=dev --no-audit --no-fund
          npm run build

          mkdir -p "$LIVE_DIR"

          rsync -a --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules/.cache" \
            "$GITHUB_WORKSPACE/" "$LIVE_DIR/"

          sudo systemctl restart "$SERVICE"
          sudo systemctl status "$SERVICE" --no-pager
